apiVersion: 1

groups:
  - orgId: 1
    name: app
    folder: TaskFlow
    interval: 10s
    rules:
      - uid: app-down-warning
        title: App down (1 failed check)
        condition: C
        for: 0s
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Prometheus could not reach the TaskFlow app on the last check
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: up{job="taskflow"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: app-down-critical
        title: App down (2 consecutive failures)
        condition: C
        for: 20s
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: The TaskFlow app has failed 2 checks in a row
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: up{job="taskflow"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: http-5xx-warning
        title: 5xx error rate above 1%
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: More than 1% of requests returned 5xx over the last 5 minutes
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 100 * (sum(rate(flask_http_request_total{job="taskflow",status=~"5.."}[5m])) or vector(0)) / sum(rate(flask_http_request_total{job="taskflow"}[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }

      - uid: http-5xx-critical
        title: 5xx error rate above 5%
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: More than 5% of requests returned 5xx over the last 5 minutes
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 100 * (sum(rate(flask_http_request_total{job="taskflow",status=~"5.."}[5m])) or vector(0)) / sum(rate(flask_http_request_total{job="taskflow"}[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }

      - uid: latency-p95-warning
        title: p95 latency above 500 ms
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 95th percentile request latency has been above 500 ms over the last 5 minutes
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: histogram_quantile(0.95, sum by (le) (rate(flask_http_request_duration_seconds_bucket{job="taskflow"}[5m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.5] }

      - uid: latency-p95-critical
        title: p95 latency above 1000 ms
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 95th percentile request latency has been above 1000 ms over the last 5 minutes
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: histogram_quantile(0.95, sum by (le) (rate(flask_http_request_duration_seconds_bucket{job="taskflow"}[5m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }

      - uid: container-restart-warning
        title: Container restarted
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarted in the last 10 minutes"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max by (name) (changes(container_start_time_seconds{name!=""}[10m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: container-restart-critical
        title: Container restarted 3 or more times
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} restarted 3 or more times in the last 10 minutes"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max by (name) (changes(container_start_time_seconds{name!=""}[10m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gte, params: [3] }
