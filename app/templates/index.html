<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold">TaskFlow</span>
        </div>
    </nav>

    <main class="container" style="max-width: 720px;">
        <div class="card mb-4">
            <div class="card-body">
                <h2 class="h5 card-title">Add a task</h2>
                <form id="task-form">
                    <div class="mb-2">
                        <input id="task-title" class="form-control" type="text"
                               placeholder="Title" maxlength="200" required>
                    </div>
                    <div class="mb-2">
                        <textarea id="task-description" class="form-control"
                                  rows="2" placeholder="Description (optional)"></textarea>
                    </div>
                    <div id="form-error" class="text-danger small mb-2 d-none"></div>
                    <button id="add-task-btn" type="submit" class="btn btn-primary">Add task</button>
                </form>
            </div>
        </div>

        <h2 class="h5">Tasks</h2>
        <ul id="task-list" class="list-group mb-4">
            <li class="list-group-item text-muted">No tasks yet.</li>
        </ul>
    </main>
    <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-modal-label" aria-hidden="true">
        <div class="modal-dialog">
            <form id="edit-form" class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="edit-modal-label">Edit task</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="edit-task-id">
                    <div class="mb-2">
                        <label for="edit-title" class="form-label">Title</label>
                        <input id="edit-title" class="form-control" type="text" maxlength="200" required>
                    </div>
                    <div class="mb-2">
                        <label for="edit-description" class="form-label">Description</label>
                        <textarea id="edit-description" class="form-control" rows="3"></textarea>
                    </div>
                    <div id="edit-error" class="text-danger small d-none"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button id="save-edit-btn" type="submit" class="btn btn-primary">Save changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
