
name: TaskFlow EC2 Deployment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Full successful GHCR image SHA tag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: taskflow-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Prepare TaskFlow Deployment
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full 40-character commit SHA"
            exit 1
          fi

      - name: Prepare deployment on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              -i ~/.ssh/id_ed25519 \
              "$EC2_USER@$EC2_HOST" \
              "bash -s -- '$IMAGE_TAG'" <<'REMOTE'
          set -euo pipefail

          IMAGE_TAG="$1"
          IMAGE="ghcr.io/charithabandara04/taskflow-devops-cl05-g06:$IMAGE_TAG"

          cd ~/taskflow

          echo "Pulling selected Docker image"
          sudo docker pull "$IMAGE"

          echo "Checking Docker Compose configuration"
          sudo docker compose config --quiet

          echo "Checking selected image"
          sudo IMAGE_TAG="$IMAGE_TAG" docker compose config --images

          echo "Deployment preparation successful"
          REMOTE
