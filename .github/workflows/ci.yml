name: TaskFlow CI

on:
  push:
    branches:
      - develop
      - main
      - feature/devops-setup

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Flask Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: ci_only_test_password
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://taskflow:ci_only_test_password@127.0.0.1:5432/taskflow_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Check Python code quality before running tests
      - name: Check Python code with Ruff
        run: python -m ruff check app tests

      # Run backend tests and enforce minimum code coverage
      - name: Run Backend Pytest with coverage
        run: |
          python -m pytest --ignore=tests/e2e -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=70

  build:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (with layer caching)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/charithabandara04/taskflow-devops-cl05-g06:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (fail on critical vulnerabilities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/charithabandara04/taskflow-devops-cl05-g06:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Save image for the staging and publish jobs
        run: docker save ghcr.io/charithabandara04/taskflow-devops-cl05-g06:${{ github.sha }} | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-image
          path: image.tar.gz
          retention-days: 1

  staging:
    name: Staging Deployment and Tests
    runs-on: ubuntu-latest
    needs: build

    env:
      STAGING_IMAGE: ghcr.io/charithabandara04/taskflow-devops-cl05-g06:${{ github.sha }}
      STAGING_URL: http://127.0.0.1:5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: taskflow-image

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Start staging environment
        run: docker compose -f compose.staging.yml up -d

      - name: Wait for staging health check
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$STAGING_URL/health"; then
              echo
              echo "Staging is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Staging did not become healthy"
          exit 1

      - name: Staging integration smoke test (API to PostgreSQL)
        run: |
          created=$(curl --fail --silent -X POST "$STAGING_URL/api/tasks" \
            -H "Content-Type: application/json" \
            -d '{"title": "Staging smoke test"}')
          echo "$created"
          task_id=$(echo "$created" | python3 -c "import sys, json; print(json.load(sys.stdin)['task']['id'])")
          curl --fail --silent "$STAGING_URL/api/tasks/$task_id"
          echo
          curl --fail --silent -X DELETE "$STAGING_URL/api/tasks/$task_id"
          echo

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run end-to-end tests against staging
        run: >-
          python -m pytest tests/e2e -v
          --base-url "$STAGING_URL"
          --junitxml=reports/e2e-junit.xml
          --tracing retain-on-failure
          --output test-results

      - name: Upload end-to-end test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            reports/
            test-results/
          if-no-files-found: ignore

      - name: Show staging logs
        if: always()
        run: docker compose -f compose.staging.yml logs

      - name: Tear down staging environment
        if: always()
        run: docker compose -f compose.staging.yml down -v

  publish:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: staging
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: taskflow-image

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push ghcr.io/charithabandara04/taskflow-devops-cl05-g06:${{ github.sha }}
