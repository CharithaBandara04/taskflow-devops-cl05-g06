
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: taskflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: postgresql+psycopg://taskflow:${POSTGRES_PASSWORD}@db:5432/taskflow
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
